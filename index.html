<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AS Jewels — Jewellery that feels like you</title>
  <meta name="description" content="Shop rings, earrings, necklaces, pendants, bracelets and festive sets at AS Jewels. Easy returns, secure payments, pan-India delivery.">
  <meta name="theme-color" content="#861a38">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6 52 24 32 58 12 24Z' fill='%23e8456a'/%3E%3Cpath d='M12 24h40L32 6Z' fill='%23bde8c6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <!-- Announcement ticker -->
  <div class="ticker" aria-label="Offers"><div class="ticker-track" id="ticker"></div></div>

  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <div class="header-row container">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      </button>
      <a href="#/" class="logo" aria-label="AS Jewels home">
        <span class="logo-mark">AS</span><span class="logo-word">Jewels</span>
      </a>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search rings, jhumkas, pendants…" aria-label="Search products">
      </form>
      <nav class="header-actions">
        <button class="icon-btn" id="accountBtn" aria-label="Account">
          <span id="accountIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
        </button>
        <button class="icon-btn" id="wishBtn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9Z"/></svg>
          <span class="badge" id="wishCount">0</span>
        </button>
        <button class="icon-btn" id="cartBtn" aria-label="Cart">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
      </nav>
    </div>
    <nav class="cat-nav container" id="catNav" aria-label="Categories"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="trust-strip container" id="footTrust"></div>
    <div class="footer-grid container">
      <div>
        <a href="#/" class="logo logo-light"><span class="logo-mark">AS</span><span class="logo-word">Jewels</span></a>
        <p class="muted-light" id="footTagline"></p>
        <form class="newsletter" id="newsletter">
          <input type="email" required placeholder="Your email for early offers" aria-label="Email">
          <button class="btn btn-gold" type="submit">Join</button>
        </form>
      </div>
      <div>
        <h4>Shop</h4>
        <ul id="footCats"></ul>
      </div>
      <div>
        <h4>Help</h4>
        <ul>
          <li><a href="#/page/shipping">Shipping Policy</a></li>
          <li><a href="#/page/returns">Returns &amp; Refunds</a></li>
          <li><a href="#/page/terms">Terms &amp; Conditions</a></li>
          <li><a href="#/page/privacy">Privacy Policy</a></li>
          <li><a href="#/page/contact">Contact Us</a></li>
        </ul>
      </div>
      <div>
        <h4>Get in touch</h4>
        <ul id="footContact"></ul>
      </div>
    </div>
    <div class="footer-bottom container">
      <span id="copyright"></span>
      <span class="pay-icons">UPI · Cards · Net Banking · Wallets · COD — secured by Razorpay</span>
    </div>
  </footer>

  <!-- Mobile menu -->
  <aside class="drawer drawer-left" id="menuDrawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head"><strong>Menu</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="drawer-body" id="menuBody"></div>
  </aside>

  <!-- Cart drawer -->
  <aside class="drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head"><strong>Your Bag</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="ship-meter" id="shipMeter"></div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <!-- Wishlist drawer -->
  <aside class="drawer" id="wishDrawer" aria-label="Wishlist" aria-hidden="true">
    <div class="drawer-head"><strong>Wishlist</strong><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="drawer-body" id="wishBody"></div>
  </aside>

  <!-- Account modal -->
  <div class="modal" id="accountModal" aria-hidden="true" role="dialog" aria-labelledby="accTitle">
    <div class="modal-card">
      <button class="icon-btn modal-x" data-close aria-label="Close">✕</button>
      <div id="accountBody"></div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8 1 3.9.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4Z"/></svg>
  </a>

  <!-- Scripts: settings first, then products, then the app -->
  <script src="js/config.js?v=10"></script>
  <script src="js/products.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
